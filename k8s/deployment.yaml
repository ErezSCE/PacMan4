apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman-frontend
  labels:
    app: pacman-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pacman-frontend
  template:
    metadata:
      labels:
        app: pacman-frontend
    spec:
      containers:
        - name: pacman-frontend
          image: ${FRONTEND_IMAGE:-pacman-game:latest}
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: "${NODE_ENV:-production}"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20